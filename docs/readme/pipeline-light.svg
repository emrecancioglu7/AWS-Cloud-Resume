<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Frontend deploy pipeline on every push to main: git push → npm build → prerender → check → S3 sync → CloudFront → IndexNow"><title>Frontend deploy pipeline on every push to main: git push → npm build → prerender → check → S3 sync → CloudFront → IndexNow</title><style>text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; } 
    .fade { opacity: 0; animation: fade .7s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pulse { stroke-dasharray: 16 600; stroke-dashoffset: 616; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: 0; } }
 
    .progress { stroke-dasharray: 1020; stroke-dashoffset: 1020; animation: run 7.0s linear infinite; }
    @keyframes run { 80%, 92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes lit0 { 0%, 0.0% { fill-opacity: 1; } 0.0%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit1 { 0%, 13.2% { fill-opacity: 0; } 13.3%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit2 { 0%, 26.6% { fill-opacity: 0; } 26.7%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit3 { 0%, 39.9% { fill-opacity: 0; } 40.0%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit4 { 0%, 53.2% { fill-opacity: 0; } 53.3%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit5 { 0%, 66.6% { fill-opacity: 0; } 66.7%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit6 { 0%, 79.9% { fill-opacity: 0; } 80.0%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
 @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }</style>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#059669" stop-opacity="0.18"/><stop offset="1" stop-color="#059669" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e3ece8" stroke-width="1"/></pattern>
    </defs>
    <rect width="1200" height="170" rx="18" fill="url(#bg)"/>
    <rect width="1200" height="170" rx="18" fill="url(#grid)" opacity="0.5"/>
    <rect width="1200" height="170" rx="18" fill="url(#glow)"/>
