" r="8" fill="#059669" style="animation: lit4 7.0s linear infinite"/><text x="770.0" y="114" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle" >S3 sync</text><text x="770.0" y="134" font-size="12" font-weight="400" fill="#5b6168" text-anchor="middle" >cache rules</text><circle cx="940.0" cy="70" r="14" fill="#ffffff" stroke="#059669" stroke-width="3"/><circle cx="940.0" cy="70" r="8" fill="#059669" style="animation: lit5 7.0s linear infinite"/><text x="940.0" y="114" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle" >CloudFront</text><text x="940.0" y="134" font-size="12" font-weight="400" fill="#5b6168" text-anchor="middle" >invalidate</text><circle cx="1110.0" cy="70" r="14" fill="#ffffff" stroke="#059669" stroke-width="3"/><circle cx="1110.0" cy="70" r="8" fill="#059669" style="animation: lit6 7.0s linear infinite"/><text x="1110.0" y="114" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle" >IndexNow</text><text x="1110.0" y="134" font-size="12" font-weight="400" fill="#5b6168" text-anchor="middle" >ping search</text></svg>