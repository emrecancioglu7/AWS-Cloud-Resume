<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AWS Cloud Resume — serverless resume site and admin panel on AWS, built for the Cloud Resume Challenge"><title>AWS Cloud Resume — serverless resume site and admin panel on AWS, built for the Cloud Resume Challenge</title><style>text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; } 
    .fade { opacity: 0; animation: fade .7s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pulse { stroke-dasharray: 16 600; stroke-dashoffset: 616; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: 0; } }
 
    .type { animation: type 7s steps(40, end) infinite; }
    @keyframes type { 0% { width: 0; } 18%, 92% { width: 420px; } 100% { width: 0; } }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
     @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }</style>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d12"/><stop offset="1" stop-color="#0e1a18"/></linearGradient>
      <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5"><stop offset="0" stop-color="#34d399" stop-opacity="0.18"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1a2430" stroke-width="1"/></pattern>
    </defs>
    <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
    <rect width="1200" height="360" rx="18" fill="url(#grid)" opacity="0.5"/>
    <rect width="1200" height="360" rx="18" fill="url(#glow)"/>
    <rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#1f2a33"/>
