    <g class="fade" style="animation-delay:.15s"><text x="62" y="162" font-size="60" font-weight="700" fill="#ececea" text-anchor="start" >AWS Cloud Resume</text></g>
    <g class="fade" style="animation-delay:.3s"><text x="64" y="204" font-size="22" font-weight="400" fill="#9aa3ab" text-anchor="start" >Serverless resume site + private admin panel</text></g>
    <g class="fade" style="animation-delay:.45s"><text x="64" y="236" font-size="18" font-weight="400" fill="#9aa3ab" text-anchor="start" >React 19 · Lambda · DynamoDB · Cognito · Terraform</text></g>
