    <g class="fade" style="animation-delay:.4s"><rect x="700" y="92" width="440" height="190" rx="12" fill="#11161d" stroke="#1f2a33"/><path d="M700 104a12 12 0 0 1 12-12h416a12 12 0 0 1 12 12v22H700z" fill="#1a2430"/><circle cx="720" cy="109" r="5" fill="#f87171"/><circle cx="738" cy="109" r="5" fill="#fbbf24"/><circle cx="756" cy="109" r="5" fill="#34d399"/><text x="920.0" y="114" font-size="12" font-weight="500" fill="#9aa3ab" text-anchor="middle" class="mono">~/AWS-Cloud-Resume</text><clipPath id="ln0"><rect x="720" y="144" width="0" height="26" class="type" style="animation-delay:0.0s"/></clipPath><g clip-path="url(#ln0)"><text x="722" y="162" font-size="14" font-weight="500" fill="#ececea" text-anchor="start" class="mono">$ terraform apply</text></g><clipPath id="ln1"><rect x="720" y="176" width="0" height="26" class="type" style="animation-delay:1.4s"/></clipPath><g clip-path="url(#ln1)"><text x="722" y="194" font-size="14" font-weight="500" fill="#34d399" text-anchor="start" class="mono">✓ Apply complete! backend is live</text></g><clipPath id="ln2"><rect x="720" y="208" width="0" height="26" class="type" style="animation-delay:2.8s"/></clipPath><g clip-path="url(#ln2)"><text x="722" y="226" font-size="14" font-weight="500" fill="#ececea" text-anchor="start" class="mono">$ git push origin main</text></g><clipPath id="ln3"><rect x="720" y="240" width="0" height="26" class="type" style="animation-delay:4.2s"/></clipPath><g clip-path="url(#ln3)"><text x="722" y="258" font-size="14" font-weight="500" fill="#34d399" text-anchor="start" class="mono">✓ deployed → S3 + CloudFront invalidated</text></g><rect x="722" y="272" width="9" height="16" fill="#34d399" class="cursor"/></g></svg>