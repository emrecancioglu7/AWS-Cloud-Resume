name: Deploy Web to S3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        # `npm ci` fails intermittently here: @tailwindcss/oxide-wasm32-wasi (an optional wasm
        # fallback) ships its own deps via bundleDependencies, and npm's lockfile-sync check for
        # that pattern is inconsistent across npm versions. `npm install` skips that strict
        # check and resolves correctly regardless.
        run: npm install

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Uploaded in passes so each file type gets the right Cache-Control. Order matters: the
      # --delete passes exclude everything a later pass owns, so nothing is deleted then re-added.
      - name: Upload to S3
        working-directory: apps/web
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          # Hashed Vite bundles: the filename changes with the content, so cache forever.
          aws s3 sync dist/assets "s3://$BUCKET/assets" --acl private --delete \
            --cache-control "public, max-age=31536000, immutable"

          # Images, video, PDFs, favicon: stable filenames, cache for a day.
          aws s3 sync dist "s3://$BUCKET" --acl private --delete --follow-symlinks \
            --exclude "assets/*" --exclude "*.html" --exclude "*.xml" --exclude "*.txt" --exclude "*.webmanifest" --exclude "tr" \
            --cache-control "public, max-age=86400"

          # Documents that must update as soon as a deploy lands: always revalidate.
          aws s3 sync dist "s3://$BUCKET" --acl private \
            --exclude "*" --include "*.html" --include "*.xml" --exclude "tr.html" \
            --cache-control "no-cache"
          aws s3 sync dist "s3://$BUCKET" --acl private \
            --exclude "*" --include "*.txt" \
            --content-type "text/plain; charset=utf-8" --cache-control "no-cache"
          aws s3 cp dist/site.webmanifest "s3://$BUCKET/site.webmanifest" --acl private \
            --content-type "application/manifest+json" --cache-control "no-cache"

          # The prerendered Turkish page is served at "/tr": an extensionless S3 key, so its
          # Content-Type has to be set explicitly (S3 can't infer it from a filename).
          aws s3 cp dist/tr.html "s3://$BUCKET/tr" --acl private \
            --content-type "text/html; charset=utf-8" --cache-control "no-cache"

      - name: Create CloudFront invalidation
        if: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

      # IndexNow: tells Bing (which also feeds ChatGPT search / Copilot) and other participating
      # engines that the pages changed, instead of waiting for them to recrawl. The key is not a
      # secret — IndexNow verifies it by fetching the matching public file
      # (apps/web/public/ca3a3cf4f6b8157ac5d24f6653c4b18a.txt, which must never be deleted). Never fails the deploy.
      - name: Notify search engines (IndexNow)
        run: |
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"emrecancioglu.com","key":"ca3a3cf4f6b8157ac5d24f6653c4b18a","keyLocation":"https://emrecancioglu.com/ca3a3cf4f6b8157ac5d24f6653c4b18a.txt","urlList":["https://emrecancioglu.com/","https://emrecancioglu.com/tr","https://emrecancioglu.com/pdf/Resume_EmreCANCIOGLU.pdf","https://emrecancioglu.com/pdf/Resume_EmreCANCIOGLU_TR.pdf"]}' \
            || echo "IndexNow ping failed (non-fatal)"
