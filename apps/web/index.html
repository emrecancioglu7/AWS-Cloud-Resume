<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // A returning visitor who explicitly picked Turkish lands on "/" → send them to "/tr"
        // before first paint. Crawlers have no stored choice, so they always get "/" as-is.
        // "/tr/" (trailing slash) isn't an S3 object, so normalise it to "/tr" too.
        try {
          var path = location.pathname;
          if (path === "/tr/" || (path === "/" && localStorage.getItem("lang") === "tr")) {
            location.replace("/tr" + location.search + location.hash);
          }
        } catch (e) {}
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var theme = stored === "dark" || stored === "light" ? stored : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (theme === "light") document.documentElement.classList.add("light");
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />

    <!-- Per-language title, description, canonical, hreflang, Open Graph and JSON-LD are
         generated from src/data/content.*.ts by src/seo/site.ts — injected here at build time
         (scripts/prerender.mjs) and in dev (vite.config.ts). -->
    <!--app-head-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
