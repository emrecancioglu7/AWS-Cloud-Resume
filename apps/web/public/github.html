<!doctype html>
<!-- LinkedIn-friendly link to the GitHub profile, whose own link preview is always just the avatar.
     Same pattern as resume.html: carries the share card (og-github.png, `npm run og-images`) and
     sends real visitors on to GitHub with a JavaScript redirect that link-preview bots don't run. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub — Emre Çancıoğlu (@emrecancioglu7)</title>
    <meta name="description" content="Code and projects by Emre Çancıoğlu across industrial data, cloud and automation." />
    <meta name="robots" content="noindex, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Emre Çancıoğlu" />
    <meta property="og:title" content="GitHub — Emre Çancıoğlu (@emrecancioglu7)" />
    <meta property="og:description" content="Code and projects across industrial data, cloud and automation — Node.js, Python, AWS, Terraform." />
    <meta property="og:url" content="https://emrecancioglu.com/github.html" />
    <meta property="og:image" content="https://emrecancioglu.com/og/og-github.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GitHub profile of Emre Çancıoğlu (@emrecancioglu7)" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://emrecancioglu.com/og/og-github.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <script>
      location.replace("https://github.com/emrecancioglu7");
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0b0d; color: #ececea; font: 16px system-ui, sans-serif; }
      a { color: #34d399; }
    </style>
  </head>
  <body>
    <p>Opening GitHub… <a href="https://github.com/emrecancioglu7">Click here if it doesn't open</a>.</p>
  </body>
</html>
